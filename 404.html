<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080908" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Pitzer</title>
    <link rel="icon" type="image/png" href="/pitzer-demo/pitzerLogo.png" />

    <!--
      Standalone by design. This page is served by the web server for URLs the
      site does not have, which is exactly when the SPA cannot be trusted to
      boot: it must render from its own bytes alone. So the tokens below are
      copied from src/styles/tokens.css rather than imported, and there is no
      script tag. Cost is ~3kB of HTML against the site's ~344kB JS + 20kB CSS
      + hero photo, and it paints in one round trip.

      The two woff2 files under /fonts are the same latin subsets the site
      self-hosts (src/assets/fonts). They are duplicated here because Vite
      fingerprints the bundled copies and this page needs a stable path. Only
      the latin subsets are referenced — the copy below stays inside U+00FF —
      and font-display: swap means the text paints before they arrive. They are
      fetched only by visitors who actually hit a bad URL, so the approved
      budget for the site's own critical path is untouched.

      If these tokens ever drift from tokens.css, tokens.css is the source of
      truth.

      The /pitzer-demo/ prefix on the paths below is the GitHub Project Pages
      base. Files in public/ are copied verbatim, so Vite's `base` does not
      reach them and the prefix has to be literal here. It must be kept in
      sync with `base` in vite.config.ts, and both drop back to the domain
      root for a production deployment.
    -->
    <style>
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url('/pitzer-demo/fonts/manrope-var-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'DM Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/pitzer-demo/fonts/dm-mono-400-latin.woff2') format('woff2');
      }

      :root {
        --color-canvas: #080908;
        --color-text-primary: #f1f2ec;
        --color-text-secondary: #b4b9b1;
        --color-text-muted: #737a72;
        --color-accent-pitzer: #65d7d0;
        --color-border-strong: #515b50;
        --font-display: 'Manrope', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'DM Mono', ui-monospace, monospace;
        --duration-fast: 180ms;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-canvas);
        color: var(--color-text-primary);
        font-family: var(--font-display);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 2px solid var(--color-accent-pitzer);
        outline-offset: 4px;
      }

      .shell {
        align-items: flex-start;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 0 auto;
        max-width: 34rem;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(2rem, 8vw, 5rem) clamp(1.25rem, 4vw, 4rem);
      }

      .eyebrow {
        color: var(--color-text-muted);
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        letter-spacing: 0.06em;
        line-height: 1.5;
        margin: 0;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.5rem, 5.6vw, 4rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
        margin: 1.5rem 0 0;
        overflow-wrap: break-word;
      }

      .support {
        color: var(--color-text-secondary);
        font-size: 1rem;
        line-height: 1.55;
        margin: 1.25rem 0 0;
      }

      .text-link {
        align-items: center;
        border-bottom: 1px solid var(--color-border-strong);
        display: inline-flex;
        font-size: 0.875rem;
        gap: 0.7rem;
        margin-top: 2.5rem;
        padding-bottom: 0.6rem;
        transition:
          border-color var(--duration-fast) ease,
          color var(--duration-fast) ease;
      }
      .text-link:hover {
        border-color: var(--color-accent-pitzer);
        color: var(--color-accent-pitzer);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Erro 404</p>
      <h1>Essa página saiu do compasso.</h1>
      <p class="support">O endereço pode ter mudado ou não existir.</p>
      <a class="text-link" href="/pitzer-demo/">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
        Voltar para o início
      </a>
    </main>
  </body>
</html>
