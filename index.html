<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080908" />

    <!-- ==================================================================
         DEMO MODE — REMOVE THIS TAG BEFORE THE OFFICIAL PITZER GO-LIVE.
         This is an unapproved concept built by a former student, not an
         official Pitzer property. It must not reach a search index before
         the owners have seen and approved it: a conceptual site ranking
         for "Pitzer" would compete with the school's own presence and
         imply an authorization that does not exist. public/robots.txt
         carries the same policy. See docs/OWNER_DEMO_GOAL.md.
         ================================================================== -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Describes what the page actually says (the Hero's own supporting
         line) plus the two facts that are confirmed in docs/BRAND_CONTEXT.md:
         the category and the city. The concept framing stays in the text so a
         shared link cannot be mistaken for the school's official site. -->
    <meta
      name="description"
      content="Um lugar para aprender música com o instrumento na mão. Conceito de site para a Pitzer, escola de música em Nova Friburgo."
    />
    <!-- Favicon: existing approved logo lockup, unedited. At 16–32px only the
         mark reads clearly; the wordmark text is not legible at that size. -->
    <link rel="icon" type="image/png" href="/pitzer-demo/pitzerLogo.png" />
    <title>Pitzer — Música se aprende tocando</title>

    <!-- Social preview. og:url, og:image and canonical are deliberately absent:
         all three need an absolute URL, and inventing one would publish a
         domain Pitzer does not own. twitter:card stays "summary" rather than
         "summary_large_image" because there is no share image yet — the large
         card renders as a broken empty banner without one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pitzer" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Pitzer — Música se aprende tocando" />
    <meta
      property="og:description"
      content="Um lugar para aprender música com o instrumento na mão. Conceito de site para a Pitzer, escola de música em Nova Friburgo."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pitzer — Música se aprende tocando" />
    <meta
      name="twitter:description"
      content="Um lugar para aprender música com o instrumento na mão. Conceito de site para a Pitzer, escola de música em Nova Friburgo."
    />
    <script type="module" crossorigin src="/pitzer-demo/assets/index-ev0PZFli.js"></script>
    <link rel="stylesheet" crossorigin href="/pitzer-demo/assets/index-BRLd_hek.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
